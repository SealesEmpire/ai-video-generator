services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=ai_video_generator
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - ALLOWED_ORIGINS=http://localhost:3000
      - RATE_LIMIT_PER_MINUTE=30
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # For local dev this points to the host machine's port.
        # Override with your production URL when deploying:
        #   docker compose build --build-arg REACT_APP_BACKEND_URL=https://api.example.com
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:8001}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
