# render.yaml – Render.com Blueprint (one-click deploy)
# https://render.com/docs/blueprint-spec

services:
  # ---- Backend ----
  - type: web
    name: ai-video-backend
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false                # set in Render dashboard
      - key: DB_NAME
        value: ai_video_generator
      - key: JWT_SECRET
        generateValue: true        # auto-generate a secret
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
    healthCheckPath: /api/

  # ---- Frontend ----
  - type: web
    name: ai-video-frontend
    runtime: static
    region: oregon
    rootDir: frontend
    buildCommand: yarn install --frozen-lockfile && yarn build
    staticPublishPath: build
    headers:
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false
